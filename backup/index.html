<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AirVue — Real-time air quality monitoring dashboard with interactive map, heatmap visualization, and live AQI data from 3,500+ monitoring stations across India and the world.">
    <title>AirVue - Global Air Quality Monitor</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://basemaps.cartocdn.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-wind"></i> AirVue</h1>
            <p class="subtitle">Real-time air quality monitoring across India with high-precision data from thousands of monitoring stations</p>
            <div class="controls">
                <button class="control-btn active" onclick="setView('global', this)">
                    <i class="fas fa-map"></i> India View
                </button>
                <button class="control-btn" onclick="setView('heatmap', this)">
                    <i class="fas fa-fire"></i> Heatmap
                </button>
                <button class="control-btn" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
                <div class="loading-text">
                    Loading high-resolution air quality data...<br>
                    <small>Fetching data from 3,500+ monitoring stations</small>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div class="panel-card legend" id="legend">
                <h3><i class="fas fa-palette"></i> AQI Scale</h3>
            </div>
            
            <div class="panel-card stats">
                <h3><i class="fas fa-chart-line"></i> Live Statistics</h3>
                <div class="stats-grid" id="statsGrid"></div>
            </div>
            
            <div class="panel-card live-feed">
                <h3><i class="fas fa-rss"></i> Live Updates</h3>
                <div id="liveFeed"></div>
            </div>
        </div>

        <div class="panel-card chart-panel">
            <h3><i class="fas fa-chart-bar"></i> Most Polluted Cities Comparison</h3>
            <div class="chart-container">
                <canvas id="comparisonChart"></canvas>
            </div>
        </div>

    </div>

    <button class="fab" onclick="scrollToTop()" title="Back to Top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js" defer></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
